# java-api-deployment.yaml
apiVersion: v1
kind: Service
metadata:
  name: java-api-service
  namespace: taller7-api
spec:
  selector:
    app: java-api
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api-deployment
  namespace: taller7-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-api
  template:
    metadata:
      labels:
        app: java-api
    spec:
      containers:
        - name: java-api
          image: crimsonblues/taller7-api:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.taller7-api.svc.cluster.local:2323/api-db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness # ✅ RUTA VERIFICADA
              port: 8082
              #host: 127.0.0.1 
            initialDelaySeconds: 120       # ⬆️ Aumentado a 3 minutos
            periodSeconds: 15              # Ajuste de chequeo
            timeoutSeconds: 3              # Tiempo de espera por respuesta
            failureThreshold: 5            # Permite 5 fallos antes de considerarlo "no listo"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness 
              port: 8082
            initialDelaySeconds: 180       # ⬆️ Aumentado a 4 minutos
            periodSeconds: 60              # Revisa cada 1 minuto
            timeoutSeconds: 3
            failureThreshold: 3